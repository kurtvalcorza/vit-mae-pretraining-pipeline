[project]
name = "vit-mae-pretraining-pipeline"
version = "0.1.0"
description = "DIMER-oriented ViT-MAE base pipeline: masked-image reconstruction, a linear-probe reading of the encoder, and bounded continuation of the masked-autoencoding pretraining."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kurt Valcorza" }]
keywords = ["vit-mae", "masked-autoencoder", "self-supervised", "reconstruction", "linear-probe", "dimer"]
dependencies = [
    "huggingface-hub==0.36.2",
    "numpy==2.5.3",
    "pillow==11.3.0",
    "safetensors==0.8.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torchaudio==2.11.0",
    "transformers==4.57.6",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: downloads and runs the real pinned SigLIP checkpoint",
]
